<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teona Pkhaladze | QA Engineer</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a103d; /* მუქი იასამნისფერი ფონი, Dark Mode-ის ეფექტით */
            color: #d8b4fe;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            display: flex;
            max-width: 1100px;
            width: 90%;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }
        .left-content { flex: 1.2; }
        .right-content { flex: 0.8; }
        
        .label {
            color: #c084fc; /* ნათელი იასამნისფერი აქცენტი */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 4rem;
            margin: 0;
            color: #f3e8ff; /* თითქმის თეთრი ტექსტი სათაურისთვის */
            line-height: 1;
        }
        h1 span { color: #c084fc; }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #d8b4fe; /* ღია იასამნისფერი ტექსტი */
            margin-top: 20px;
        }
        
        .buttons { margin-top: 35px; display: flex; gap: 15px; align-items: center; }
        .btn {
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-cv { 
            background-color: #c084fc; 
            color: #1a103d; 
            box-shadow: 0 4px 12px rgba(192, 132, 252, 0.4);
        }
        .btn-cv:hover {
            background-color: #d8b4fe;
            transform: translateY(-2px);
        }
        .btn-outline { 
            border: 1px solid #c084fc; 
            color: #c084fc; 
            background: transparent;
        }
        .btn-outline:hover {
            background-color: rgba(192, 132, 252, 0.1);
            transform: translateY(-2px);
        }
